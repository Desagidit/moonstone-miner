<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonstone · Troupe builder</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/builder.css"></head><body>
<header><div><span class="brand">MOONSTONE</span><h1>Troupe builder</h1></div><span id="load-status">Loading cards…</span><a href="/">Review cards ↗</a></header>
<div class="builder"><section class="library"><label for="find">Search cards</label><input id="find" type="search" placeholder="Name, keyword or tag"><details class="filters" open><summary>Combine filters</summary><label for="outer-mode">Between filter groups</label><select id="outer-mode"><option value="and">AND — match every group</option><option value="or">OR — match any group</option></select><div id="filter-groups"></div><div class="buttons"><button id="add-group">Add filter group</button><button id="clear-filters">Clear filters</button></div></details><div class="list-heading"><h2>Characters</h2><span id="result-count"></span><select id="sort" aria-label="Sort characters"><option value="name">Name</option><option value="hp">Health ↓</option><option value="energy">Energy ↓</option><option value="melee">Melee ↓</option><option value="arcane">Arcane ↓</option></select></div><div id="catalogue" aria-label="Character cards"></div></section>
<main class="focus"><div id="focused"></div></main>
<section class="roster"><h2>Your troupe</h2><label for="faction">Faction</label><select id="faction"><option>Commonwealth</option><option>Dominion</option><option>Leshavult</option><option>Shades</option></select><label for="size">Game size</label><select id="size"><option value="4">4 characters · beginner</option><option value="5">5 characters · fast</option><option value="6" selected>6 characters · full game</option></select><p id="team-status" role="status" aria-live="polite"></p><div id="team"></div><h3>Tags</h3><div id="tag-summary" class="chips"></div><h3>Keywords</h3><div id="keyword-summary" class="chips"></div><p class="help">Your troupe is saved in this browser.</p><a href="https://www.moonstonethegame.com/troupe-building" target="_blank" rel="noopener">Troupe-building rules ↗</a><p id="notice" role="status" aria-live="polite"></p></section></div><script src="/team_logic.js"></script><script src="/builder.js"></script></body></html>
