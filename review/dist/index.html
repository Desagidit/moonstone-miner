<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonstone · Card review</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="brand">MOONSTONE</span><h1>Card review</h1></div><div id="progress">Loading catalogue…</div><a href="/builder">Troupe builder ↗</a><a href="/data/characters.json" download>Export characters</a></header>
<div class="workspace"><aside><label for="search">Find a character</label><input id="search" type="search" placeholder="Name or keyword"><label for="filter">Review status</label><select id="filter"><option value="all">All cards</option><option value="pending">Needs review</option><option value="verified">Fully verified</option></select><nav id="list" aria-label="Characters"></nav></aside>
<main><div class="title"><div><span id="page" class="eyebrow"></span><h2 id="name">Loading…</h2></div><div><button id="prev">Previous</button><button id="next">Next</button></div></div><div class="review-grid"><section class="source"><a id="official" target="_blank" rel="noopener">Open official card ↗</a><div class="image-frame"><img id="card" alt="Original character and signature cards"></div><label for="zoom">Card zoom</label><input id="zoom" type="range" min="100" max="250" value="100"><details><summary>Extracted source text</summary><pre id="raw"></pre></details></section><section><div id="editor"></div><div class="savebar"><p id="message" role="status" aria-live="polite">Compare the fields below with the original card.</p><button id="save">Save changes</button><button id="verify" class="primary">Verify and save whole card</button></div></section></div></main></div><script src="/app.js"></script></body></html>
