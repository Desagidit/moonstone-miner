name: Publish troupe builder
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check builder behaviour
        run: |
          node test_team_logic.cjs
          node test_builder_ui.cjs
          node test_review_ui.cjs
          node --check review/dist/builder.js
      - name: Install PDF renderer
        run: python -m pip install -r requirements.txt
      - name: Validate suggested partner cores
        run: python suggested_partners.py --check
      - name: Validate miniature metadata
        run: python miniatures.py --check
      - name: Validate guides and summon links
        run: |
          python character_guides.py --check
          python test_character_guides.py
          python test_reviews.py
      - name: Generate high-resolution cards
        run: python render_card_images.py
      - name: Export static builder
        run: python export_site.py
      - name: Check static export
        run: |
          node --check site/builder.js
          node test_builder_ui.cjs --static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
